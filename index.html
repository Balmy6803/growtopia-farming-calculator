    // ==========================================
    // PRESET DATABASE: COMMON FARMABLES
    // ==========================================
    const COMMON_FARMABLES = Object.freeze([
      { name: 'Rice', rarity: 23, maxFruit: 8, avgSeedGain: 28 },
      { name: 'Sugar Cane', rarity: 24, maxFruit: 8, avgSeedGain: 25 },
      { name: 'Ladder', rarity: 26, maxFruit: 8, avgSeedGain: 25 },
      { name: 'Sheet Music: Sharp Bass', rarity: 32, maxFruit: 8, avgSeedGain: 22 },
      { name: 'Steel Block', rarity: 35, maxFruit: 8, avgSeedGain: 22 },
      { name: 'Steam Tubes', rarity: 36, maxFruit: 8, avgSeedGain: 20 },
      { name: 'Golden Block', rarity: 41, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Venus Guytrap', rarity: 41, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Hanging Guytrap', rarity: 41, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Blackrock Wall', rarity: 42, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Fish Tank', rarity: 42, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Lovewillow\'s Lace', rarity: 42, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Space Connector', rarity: 43, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Starship Light Wall', rarity: 45, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Pepper Tree', rarity: 47, maxFruit: 8, avgSeedGain: 18 },
      { name: 'Starship Floor Grill', rarity: 51, maxFruit: 8, avgSeedGain: 16 },
      { name: 'Pinball Bumper', rarity: 53, maxFruit: 8, avgSeedGain: 16 },
      { name: 'Treasure Chest', rarity: 55, maxFruit: 8, avgSeedGain: 16 },
      { name: 'Director\'s Chair', rarity: 64, maxFruit: 8, avgSeedGain: 14 },
      { name: 'Laser Grid', rarity: 68, maxFruit: 8, avgSeedGain: 14 },
      { name: 'High Tech Block', rarity: 69, maxFruit: 8, avgSeedGain: 14 },
      { name: 'Roshambo Block', rarity: 71, maxFruit: 8, avgSeedGain: 14 },
      { name: 'Chandelier', rarity: 87, maxFruit: 8, avgSeedGain: 12 },
      { name: 'Sorcerer Stone', rarity: 87, maxFruit: 8, avgSeedGain: 12 },
      { name: 'Magic Bell', rarity: 95, maxFruit: 8, avgSeedGain: 10 },
      { name: 'Clouds Background', rarity: 119, maxFruit: 8, avgSeedGain: 10 },
    ]);

    // ==========================================
    // 1. ENGINE & CALCULATION LOGIC
    // ==========================================

    const BASE_RATES = Object.freeze({
      harvester: 0.10,         // 10% extra harvest blocks from Harvester / Harvester of Sorrows (rarity < 100)
      elock: 0.10,             // 10% chance of adding an extra gem drop when breaking blocks
      cosmicCape: 0.00001,     // 0.001% chance of Comet Dust per smashed block (0.001 / 100)
      galaxySkin: 0.10,        // 10% extra blocks from Galaxy Skin
      winterWishingStar: 0.02, // 2% extra blocks from Winter Wishing Star
      jersey: 0.10,            // 10% extra gems from American Sports Ball Jersey
      blockGems: 8 / 12,       // Block drop rates
      blockBlocks: 1 / 12,
      blockSeeds: 3 / 12,
      clover: Object.freeze({
        blockChance: 0.10,          // 10% chance for an extra block to be dropped
        gemChance: 0.10,            // 10% chance to multiply gem drops by up to 5
        gemAvgBonusMultiplier: 2.0, // Expected bonus: average multiplier is 3x (1x-5x), giving +2x bonus gems on trigger
      }),
      buddy: 0.02,             // 2% Buddy Block Head rate
      dcs: 0.02,               // 2% Dreamcatcher Staff rate (rarity < 100)
    });

    const GrowtopiaMath = {
      getBlockYieldMultiplier(maxblock) {
        const mb = String(maxblock);
        if (mb === '2') return 1.5 * 2.5;     // 3.75 (Farmable)
        if (mb === '3') return 2.0 * 2.5;     // 5.00 (Very farmable)
        if (mb === '4') return 2.5 * 2.5;     // 6.25 (Super farmable)
        return 1.0 * 2.5;                     // 2.50 (Not farmable)
      },

      getGemBaseYield(rarity) {
        return rarity > 30 ? rarity / 9 : rarity / 13.5;
      },

      getGrowingTimeSeconds(rarity) {
        return rarity * (rarity * rarity + 30);
      },

      getXpPerAction(rarity) {
        return 1 + Math.floor(rarity / 5);
      },

      getFarmerBonusRate(level) {
        const lvl = Number(level) || 1;
        if (lvl >= 10) return 0.03;     // Level 10: 3%
        if (lvl >= 8) return 0.02;      // Levels 8-9: 2%
        if (lvl >= 6) return 0.015;     // Levels 6-7: 1.5%
        if (lvl >= 4) return 0.01;      // Levels 4-5: 1%
        if (lvl >= 2) return 0.005;     // Levels 2-3: 0.5%
        return 0;                       // Level 1: 0%
      },

      getBuilderBonusRate(level) {
        const lvl = Number(level) || 1;
        if (lvl >= 10) return 0.03;     // Level 10: 3%
        if (lvl >= 8) return 0.02;      // Levels 8-9: 2%
        if (lvl >= 6) return 0.015;     // Levels 6-7: 1.5%
        if (lvl >= 4) return 0.01;      // Levels 4-5: 1%
        if (lvl >= 2) return 0.005;     // Levels 2-3: 0.5%
        return 0;                       // Level 1: 0%
      },

      formatDuration(totalSeconds) {
        if (!Number.isFinite(totalSeconds) || totalSeconds <= 0) return '0s';

        let sec = Math.floor(totalSeconds);
        const d = Math.floor(sec / 86400);
        sec %= 86400;
        const h = Math.floor(sec / 3600);
        sec %= 3600;
        const m = Math.floor(sec / 60);
        const s = sec % 60;

        const parts = [];
        if (d > 0) parts.push(`${d}d`);
        if (h > 0) parts.push(`${h}h`);
        if (m > 0) parts.push(`${m}m`);
        if (s > 0 || parts.length === 0) parts.push(`${s}s`);

        return parts.join(' ');
      },
    };

    function precomputeSimulationContext(inputs) {
      const rarity = Number(inputs.rarity) || 0;
      const rawLvl = Number(inputs.lvl) || 1;
      const lvl = Math.min(6, Math.max(1, rawLvl)); // Ancestor artifacts cap at Level 6
      const artifact = inputs.artifact || null;

      const seedHarvestRate = (rarity + 12 > 0) ? (4 / (rarity + 12)) : 0;
      const blockYieldRate = GrowtopiaMath.getBlockYieldMultiplier(inputs.maxblock);
      const gemBaseYield = GrowtopiaMath.getGemBaseYield(rarity);
      const xpPerAction = GrowtopiaMath.getXpPerAction(rarity);

      let growthSeconds = GrowtopiaMath.getGrowingTimeSeconds(rarity);
      // Green Ances: Lv 1 (2%), Lv 2 (4%), Lv 3 (6%), Lv 4 (8%), Lv 5 (10%), Lv 6 (12%)
      if (artifact === 'seed') {
        const seedBonus = (lvl * 2) / 100;
        growthSeconds *= (1 - seedBonus);
      }

      // Role Up bonus rates
      const farmerBonusRate = inputs.farmerRole ? GrowtopiaMath.getFarmerBonusRate(inputs.farmerLevel) : 0;
      const builderBonusRate = inputs.builderRole ? GrowtopiaMath.getBuilderBonusRate(inputs.builderLevel) : 0;

      // ==========================================
      // BONUS BLOCKS: INDEPENDENT ROLLS & 30% CAP
      // ==========================================
      let rawBonusBlockChance = 0;

      // Blue Ances: Lv 1 (5%), Lv 2 (6%), Lv 3 (7%), Lv 4 (8%), Lv 5 (9%), Lv 6 (10%)
      if (artifact === 'tesseract') {
        rawBonusBlockChance += (4 + lvl) / 100;
      }
      if (inputs.buddy) {
        rawBonusBlockChance += BASE_RATES.buddy; // 2%
      }
      if (inputs.winterWishingStar) {
        rawBonusBlockChance += BASE_RATES.winterWishingStar; // 2%
      }
      if (inputs.galaxySkin) {
        rawBonusBlockChance += BASE_RATES.galaxySkin; // 10%
      }
      // Lucky Clover / Songpyeon: 10% extra block roll
      if (inputs.clover) {
        rawBonusBlockChance += BASE_RATES.clover.blockChance; // 10%
      }
      // Builder Role double block drop factor (0.5% - 3%)
      if (builderBonusRate > 0) {
        rawBonusBlockChance += builderBonusRate;
      }

      // Enforce the ~30% hard cap on cumulative bonus block drop chances
      const cappedBonusBlockChance = Math.min(0.30, rawBonusBlockChance);
      const isBlockCapped = rawBonusBlockChance > 0.30;

      // Total block return per smash: Base (8.33%) + Capped Bonus Blocks
      const totalSmashBlockReturn = BASE_RATES.blockBlocks + cappedBonusBlockChance;
      const smashDenominator = 1 - totalSmashBlockReturn;
      const compoundSmashMultiplier = smashDenominator > 0 ? (1 / smashDenominator) : 1;

      // Harvester only activates if equipped AND the item rarity is strictly below 100
      const isHarvesterActive = Boolean(inputs.harvester && rarity < 100);
      const harvesterRate = isHarvesterActive ? BASE_RATES.harvester : 0;

      // Dreamcatcher Staff only activates if equipped AND the item rarity is strictly below 100
      const isDcsActive = Boolean(inputs.dcs && rarity < 100);
      const dcsRate = isDcsActive ? BASE_RATES.dcs : 0;

      // Emerald Lock: 10% chance of adding an extra gem drop when breaking blocks (+0.10 gems / block)
      const elockRate = inputs.elock ? BASE_RATES.elock : 0;
      const cosmicCapeRate = inputs.cosmicCape ? BASE_RATES.cosmicCape : 0;

      // Lucky Clover / Songpyeon gem bonus (10% chance for up to 5x gems)
      const cloverGemBonus = inputs.clover 
        ? (gemBaseYield * BASE_RATES.blockGems * BASE_RATES.clover.gemChance * BASE_RATES.clover.gemAvgBonusMultiplier) 
        : 0;

      // ==========================================
      // BONUS GEMS: LENS & JERSEY NON-STACKING
      // (Emerald Lock & Clover remain fully additive)
      // ==========================================
      let extraGemChance = 0;
      let isJerseyOverridingLens = false;

      // Red Ances: Lv 1 (5%), Lv 2 (6%), Lv 3 (7%), Lv 4 (8%), Lv 5 (9%), Lv 6 (10%)
      const lensBonus = (artifact === 'lens') ? ((4 + lvl) / 100) : 0;
      // American Sports Ball Jersey: 10% bonus chance
      const jerseyBonus = inputs.jersey ? BASE_RATES.jersey : 0;

      // Non-stacking rule: Jersey and Red Ances do not stack
      if (inputs.jersey) {
        extraGemChance = jerseyBonus;
        if (artifact === 'lens') {
          isJerseyOverridingLens = true;
        }
      } else if (artifact === 'lens') {
        extraGemChance = lensBonus;
      }

      const combinedExtraGemChance = extraGemChance;
      const extraGemRate = gemBaseYield * BASE_RATES.blockGems * combinedExtraGemChance;

      // Cumulative Bonus Gem Chance across all active equipment and effects
      let totalBonusGemChance = combinedExtraGemChance;
      if (inputs.elock) {
        totalBonusGemChance += BASE_RATES.elock; // 10%
      }
      if (inputs.clover) {
        totalBonusGemChance += BASE_RATES.clover.gemChance; // 10%
      }
      if (farmerBonusRate > 0) {
        totalBonusGemChance += farmerBonusRate; // 0.5% - 3.0%
      }

      // Yellow Ances: Lv 1 (5%), Lv 2 (6%), Lv 3 (7%), Lv 4 (8%), Lv 5 (9%), Lv 6 (10%) double XP chance
      let totemXpMultiplier = 0;
      if (artifact === 'totem') {
        const totemBonus = (4 + lvl) / 100;
        totemXpMultiplier = xpPerAction * totemBonus;
      }

      return {
        rarity,
        seedHarvestRate,
        blockYieldRate,
        gemBaseYield,
        xpPerAction,
        growthSeconds,
        rawBonusBlockChance,
        cappedBonusBlockChance,
        isBlockCapped,
        compoundSmashMultiplier,
        harvesterRate,
        isHarvesterActive,
        dcsRate,
        isDcsActive,
        farmerBonusRate,
        builderBonusRate,
        elockRate,
        cosmicCapeRate,
        cloverGemBonus,
        combinedExtraGemChance,
        extraGemRate,
        totalBonusGemChance,
        isJerseyOverridingLens,
        totemXpMultiplier,
      };
    }

    function calculateFarming(inputs) {
      const ctx = precomputeSimulationContext(inputs);
      const maxCapacity = Number(inputs.maximum) > 0 ? Number(inputs.maximum) : Infinity;

      let currentSeeds = Math.min(Math.max(0, Number(inputs.seeds) || 0), maxCapacity);
      let currentBlocks = Math.max(0, Number(inputs.blocks) || 0) + Math.max(0, Number(inputs.cycleblocks) || 0);
      const cycleBlocksInput = Math.max(0, Number(inputs.cycleblocks) || 0);

      const cycles = [];
      const extras = [];

      const totals = {
        seeds: 0,
        netSeedGain: 0,
        blocks: 0,
        gems: 0,
        dust: 0,
        xp: 0,
        timeSeconds: 0,
        worldLocks: 0,
      };

      const seedToWlRate = Number(inputs.seedswl) > 0 ? 1 / Number(inputs.seedswl) : 0;
      const gemToWlRate = Number(inputs.gemwl) > 0 ? 1 / Number(inputs.gemwl) : 0;
      const dustToWlRate = Number(inputs.dustwl) > 0 ? 1 / Number(inputs.dustwl) : 0;
      const totalCycles = Math.max(0, Math.floor(Number(inputs.times) || 0));

      for (let i = 0; i < totalCycles; i++) {
        const cycleStartSeeds = Math.min(currentSeeds, maxCapacity);

        // Harvest drops
        const harvestedSeeds = cycleStartSeeds * ctx.seedHarvestRate;
        const baseHarvestBlocks = cycleStartSeeds * ctx.blockYieldRate;
        const harvesterExtraBlocks = baseHarvestBlocks * ctx.harvesterRate;
        const dcsExtraBlocks = cycleStartSeeds * ctx.dcsRate;

        const totalHarvestedBlocks = baseHarvestBlocks + harvesterExtraBlocks + dcsExtraBlocks;

        // Initial blocks + smashing loop resolved via compound multiplier
        const effectiveBlocks = (totalHarvestedBlocks + currentBlocks) * ctx.compoundSmashMultiplier;

        // Seeds from smashing blocks (1 seed per 4 smashed blocks)
        const finalSeeds = harvestedSeeds + (effectiveBlocks * 0.25);

        // Gems
        const baseHarvestGems = ctx.gemBaseYield * cycleStartSeeds;
        const farmerHarvestBonusGems = baseHarvestGems * ctx.farmerBonusRate;
        const baseSmashGems = ctx.gemBaseYield * BASE_RATES.blockGems * effectiveBlocks;

        // Additive stacking of gem bonuses (Emerald lock + Clover + Lens/Jersey)
        const bonusGems = farmerHarvestBonusGems +
                          (effectiveBlocks * ctx.elockRate) +
                          (effectiveBlocks * ctx.cloverGemBonus) +
                          (effectiveBlocks * ctx.extraGemRate);
        const cycleGems = baseHarvestGems + baseSmashGems + bonusGems;

        // Comet Dust Drops (from Cosmic Cape)
        const cycleDust = effectiveBlocks * ctx.cosmicCapeRate;

        // XP
        const baseActions = cycleStartSeeds + effectiveBlocks;
        const cycleXp = (baseActions * ctx.xpPerAction) + (baseActions * ctx.totemXpMultiplier);

        // WL Calculations (Seeds + Gems + Comet Dust)
        const netSeedProfit = finalSeeds - cycleStartSeeds;
        const cycleWls = (Math.max(0, netSeedProfit) * seedToWlRate) + 
                         (cycleGems * gemToWlRate) + 
                         (cycleDust * dustToWlRate);

        // Running totals
        totals.netSeedGain += netSeedProfit;
        totals.blocks += effectiveBlocks;
        totals.gems += Math.floor(cycleGems);
        totals.dust += cycleDust;
        totals.xp += Math.floor(cycleXp);
        totals.timeSeconds += ctx.growthSeconds;
        totals.worldLocks += cycleWls;

        cycles.push({
          cycle: i + 1,
          startSeeds: Math.floor(cycleStartSeeds),
          endSeeds: Math.floor(finalSeeds),
          seedProfit: Math.floor(netSeedProfit),
          blocksSmashed: Math.floor(effectiveBlocks),
          gems: Math.floor(cycleGems),
          cometDust: Number(cycleDust.toFixed(4)),
          xp: Math.floor(cycleXp),
          worldLocks: Math.floor(cycleWls),
        });

        if (inputs.extras) {
          extras.push({
            cycle: i + 1,
            totalNetSeeds: Math.floor(totals.netSeedGain),
            totalGems: totals.gems,
            totalDust: Number(totals.dust.toFixed(4)),
            totalWls: Math.floor(totals.worldLocks),
          });
        }

        currentSeeds = Math.min(finalSeeds, maxCapacity);
        currentBlocks = cycleBlocksInput;
      }

      totals.seeds = Math.floor(currentSeeds);
      totals.netSeedGain = Math.floor(totals.netSeedGain);
      totals.gems = Math.floor(totals.gems);
      totals.worldLocks = Math.floor(totals.worldLocks);
      totals.formattedTime = GrowtopiaMath.formatDuration(totals.timeSeconds);

      return {
        ctx,
        totals,
        cycles,
        extras,
      };
    }

Total Growth Duration: ${result.totals.formattedTime}`;

        // Robust fallback for iFrame clipboard restrictions
        try {
          const textArea = document.createElement("textarea");

          textArea.style.position = "fixed";

          textArea.style.top = "-999999px";

                          key: 'buddy',

                          <div className="flex justify-between py-1 border-b border-slate-850">

                      </div>

                      <div className="space-y-2">
                        {result.cycles.slice(0, 10).map((c) => {
                          const seedRatio = Math.min(100, (c.endSeeds / (inputs.maximum || 2500)) * 100);
                          return (
                            <div key={c.cycle} className="space-y-1">
                              <div className="flex justify-between text-[11px] font-mono">
                                <span className="text-slate-300 font-bold">Cycle {c.cycle}</span>
                                <span className="text-emerald-300">{c.endSeeds.toLocaleString()} seeds (+{c.seedProfit}) • {c.worldLocks.toLocaleString()} WLs</span>
                              </div>
                              <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                                <div
                                  className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-300"
                                  style={{ width: `${seedRatio}%` }}
                                />
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      {result.cycles.length > 10 && (
                        <p className="text-[11px] text-slate-500 text-center pt-2">
                          Showing first 10 of {result.cycles.length} cycles. Check Cycle Table for full history.
                        </p>
                      )}
                    </div>
                  </div>
                )}

              </div>

            </div>

            {/* FOOTNOTE */}
            <footer className="pt-6 pb-4 border-t border-slate-850 text-center space-y-1.5">
              <p className="text-xs text-slate-500 leading-relaxed">
                This website is for reference only. Your individual results may vary significantly.
              </p>
              <p className="text-xs text-slate-500 leading-relaxed">
                All of the information and calculations used in this website are from the Growtopia Wiki website.
              </p>
              <p className="text-xs text-slate-500 leading-relaxed">
                This website was completely written, designed, and coded with Google Gemini.
              </p>
            </footer>

            {/* POPUP MODAL: COMMON FARMABLES SELECTION */}
            {showPresetModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
                <div 
                  className="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden"
                  onClick={(e) => e.stopPropagation()}
                >
                  {/* Modal Header */}
                  <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800">
                    <div>
                      <h3 className="text-base font-bold text-white">Select Common Farmable Preset</h3>
                    </div>
                    <button
                      type="button"
                      onClick={() => setShowPresetModal(false)}
                      className="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
                    >
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Search Bar */}
                  <div className="p-4 border-b border-slate-800 bg-slate-950/50">
                    <div className="relative">
                      <IconSearch className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input
                        type="text"
                        placeholder="Search farmable or rarity (e.g., Laser Grid, 68)..."
                        value={presetSearch}
                        onChange={(e) => setPresetSearch(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 transition"
                      />
                    </div>
                  </div>

                  {/* Preset List */}
                  <div className="overflow-y-auto p-4 space-y-2 max-h-[55vh]">
                    {filteredPresets.length === 0 ? (
                      <p className="text-xs text-slate-500 text-center py-8">No farmables found matching "{presetSearch}".</p>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        {filteredPresets.map((farmable) => {
                          const isSelected = selectedPreset?.name === farmable.name;
                          return (
                            <div
                              key={farmable.name}
                              onClick={() => handleSelectPreset(farmable)}
                              className={`p-3 rounded-xl border cursor-pointer transition flex items-center justify-between group ${
                                isSelected
                                  ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200'
                                  : 'bg-slate-950/60 border-slate-800 hover:border-slate-700 hover:bg-slate-850/60'
                              }`}
                            >
                              <div className="space-y-1">
                                <div className="text-xs font-bold text-slate-200 group-hover:text-emerald-300 transition">
                                  {farmable.name}
                                </div>
                                <div className="text-[10px] text-slate-400 flex items-center gap-2">
                                  <span>Max Fruit: <strong className="text-slate-300">{farmable.maxFruit}</strong></span>
                                  <span>•</span>
                                  <span>Seed Gain: <strong className="text-emerald-400">+{farmable.avgSeedGain}</strong></span>
                                </div>
                              </div>
                              <div className="text-right">
                                <span className="px-2 py-1 rounded-lg bg-slate-900 border border-slate-800 text-[11px] font-mono font-bold text-emerald-400 group-hover:border-emerald-500/40 transition">
                                  Rarity {farmable.rarity}
                                </span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  {/* Modal Footer */}
                  <div className="p-3 border-t border-slate-800 bg-slate-950 flex justify-end">
                    <button
                      type="button"
                      onClick={() => setShowPresetModal(false)}
                      className="px-4 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Mount the Application to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
